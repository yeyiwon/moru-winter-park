name: Verify retained world and operations
on:
  push:
    branches: [main, codex/official-ui-v46]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:vercel
      - run: npm run build:realtime
      - run: npm run test:budget
      - run: LOAD_SECONDS=15 npm run test:load
      - name: Browser dependencies (QA only)
        run: |
          npm install --prefix "$RUNNER_TEMP/winter-browser" --no-save --package-lock=false playwright@1.62.1
          if command -v google-chrome > /dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/winter-browser/node_modules/.bin/playwright" install --with-deps chromium
            echo "CHROME_PATH=$(node -e 'console.log(require(process.env.RUNNER_TEMP+"/winter-browser/node_modules/playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
          fi
      - name: Public multiplayer and responsive browser checks
        run: |
          export PLAYWRIGHT_PATH="$RUNNER_TEMP/winter-browser/node_modules/playwright-core/index.mjs"
          node scripts/dev-realtime.mjs > "$RUNNER_TEMP/winter-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4190/api/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-operations-browser.mjs
      # Publication stays separate: owner approval, database backup, matching source
      # artifacts and staging smoke checks are required before production activation.
