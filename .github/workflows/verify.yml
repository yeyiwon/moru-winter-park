name: Verify retained world and operations
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:vercel
      - run: npm run build:realtime
      - run: npm run test:budget
      - run: LOAD_SECONDS=15 npm run test:load
      # Publication stays separate: owner approval, database backup, matching source
      # artifacts and staging smoke checks are required before production activation.
