<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121425"><title>오늘의 잡지식 · 잡지식 연구소</title><link rel="stylesheet" href="style.css?v=quiet2"></head>
<body>
<canvas id="park-canvas" aria-label="마법 놀이공원. WASD 또는 방향키로 이동하고 드래그로 시점을 바꿉니다."></canvas>
<div class="park-vignette"></div>
<header>
<a class="brand" href="#" aria-label="홈">잡지식 연구소</a>
<details class="park-menu" id="park-menu"><summary aria-label="메뉴"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M5 16h14"/></svg></summary><div class="menu-panel"><button id="open-quiz">아무 문제나 풀기 <span>↗</span></button><nav aria-label="둘러보기"><button data-page="dilemma">다른 관점</button><button data-page="collection">내 서랍 <small id="saved-count">0</small></button></nav><div class="menu-divider"></div><button id="sound" class="sound" aria-pressed="false" aria-label="효과음 켜기">소리 꺼짐</button><button id="motion" aria-pressed="false">움직임</button></div></details>
</header>
<section class="park-home"><h1>오늘의 잡지식</h1><p>어디에 쓸지는 모르겠고,<br>일단 알아둡니다.</p></section>
<article id="discovery-card" class="discovery-card" aria-label="발견한 잡지식" hidden><div class="discovery-content"><div class="discovery-top"><span id="discovery-field"></span><button id="dismiss-discovery" aria-label="발견 카드 닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div><h2 id="discovery-question"></h2><button id="open-discovery"><span>풀어보기</span><span aria-hidden="true">↗</span></button></div></article>
<div class="quiz-shade" id="quiz-shade" hidden></div>
<div id="quiz-overlay" class="quiz-overlay" role="dialog" aria-modal="true" aria-label="잡지식 카드" hidden>
<div class="panel-toolbar"><span>일단 알아두자.</span><button class="close-quiz icon-button" id="close-quiz" aria-label="퀴즈 닫고 공원 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div>
<main id="app"></main>
</div>
<div class="discovery-flash" aria-hidden="true"></div>
<div id="joystick" class="joystick" role="group" aria-label="플러프 이동 조이스틱"><span class="joystick-stick" aria-hidden="true"></span><button class="joy-up" data-move="up" aria-label="앞으로 이동">↑</button><button class="joy-left" data-move="left" aria-label="왼쪽으로 이동">←</button><button class="joy-right" data-move="right" aria-label="오른쪽으로 이동">→</button><button class="joy-down" data-move="down" aria-label="뒤로 이동">↓</button></div>
<div class="park-bottom">
<p id="park-status" class="sr-only" role="status">공원에 불 켜는 중…</p>
<details class="control-help"><summary><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 9h.01M12 9h.01M17 9h.01M7 12h.01M12 12h.01M17 12h.01M8 15h8"/></svg><span>조작법</span></summary><div><p><kbd>W A S D</kbd><span>이동 · 방향키도 가능</span></p><p><kbd>Space</kbd><span>점프</span></p><p><span>책에 가까이 가면 질문이 나타납니다.</span></p><p><span>드래그로 시점 · 휠로 확대<br>모바일에서는 플러프를 눌러 점프</span></p></div></details>

</div>
<script src="data.js?v=quiet2"></script><script src="app.js?v=quiet2"></script><script src="effects.js?v=quiet2"></script><script type="module" src="park.js?v=quiet2"></script>
</body></html>
