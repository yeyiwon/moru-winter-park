<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b12"><title>잡지식 연구소</title><link rel="stylesheet" href="style.css?v=walk2"></head><body><canvas id="park-canvas" aria-label="마법 놀이공원 3D 공간. WASD 또는 방향키로 플러프를 움직이고 드래그로 시점을 바꿉니다."></canvas><div class="park-vignette"></div><header><a class="brand" href="#" aria-label="홈">잡지식 연구소</a><nav><button data-page="explore" class="active">탐색</button><button data-page="dilemma">생각 실험</button><button data-page="collection">내 서랍 <small id="saved-count">0</small></button></nav></header><section class="park-home"><span class="park-label">잡지식 연구소 · 밤 산책</span><h1>오늘 잡지식 추가</h1><p>어디에 쓸지는 모르겠고, 일단 알아둡니다.</p></section><div id="quiz-overlay" class="quiz-overlay" role="dialog" aria-modal="true" aria-label="잡지식 카드" hidden><button class="close-quiz" id="close-quiz" aria-label="퀴즈 닫고 공원 보기">공원으로 돌아가기 <span>×</span></button><main id="app"></main></div><div class="discovery-flash" aria-hidden="true"></div><div id="joystick" class="joystick" role="group" aria-label="플러프 이동 조이스틱"><span class="joystick-guide" aria-hidden="true">이동</span><span class="joystick-stick" aria-hidden="true"></span><button class="joy-up" data-move="up" aria-label="앞으로 이동">↑</button><button class="joy-left" data-move="left" aria-label="왼쪽으로 이동">←</button><button class="joy-right" data-move="right" aria-label="오른쪽으로 이동">→</button><button class="joy-down" data-move="down" aria-label="뒤로 이동">↓</button></div><div class="park-bottom"><p id="park-status" role="status">공원에 불 켜는 중…</p><div class="park-dock"><button id="open-quiz" class="dock-primary"><b id="interact-label">잡지식 줍기</b><kbd>E</kbd><span>↗</span></button><button id="jump" class="jump-button" aria-label="플러프 점프">점프</button><button id="park-reset">시점 맞추기</button></div><p class="control-legend"><span><kbd>W A S D</kbd> / 방향키 이동</span><span><kbd>Space</kbd> 점프</span><span>드래그 시점</span></p><
