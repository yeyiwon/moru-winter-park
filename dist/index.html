<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121425"><title>오늘의 잡지식 · 잡지식 연구소</title><link rel="stylesheet" href="style.css?v=islands1"></head>
<body>
<canvas id="park-canvas" aria-label="판타지 지식 섬. 바닥을 누르거나 WASD로 이동하고 드래그로 시점을 바꿉니다."></canvas>
<div class="park-vignette"></div>
<header>
<a class="brand" href="#" aria-label="홈">잡지식 연구소</a>
<details class="park-menu" id="park-menu"><summary aria-label="메뉴"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M5 16h14"/></svg></summary><div class="menu-panel"><button id="open-quiz">아무 문제나 풀기 <span>↗</span></button><nav aria-label="둘러보기"><button data-page="dilemma">다른 관점</button><button data-page="collection">내 서랍 <small id="saved-count">0</small></button></nav><div class="menu-divider"></div><button id="open-map">섬 지도 <span>↗</span></button><button id="open-settings">조명 · 플러프</button></div></details>
</header>
<section class="park-home"><h1>오늘의 잡지식</h1><p>어디에 쓸지는 모르겠고,<br>일단 알아둡니다.</p></section>
<article id="discovery-card" class="discovery-card" aria-label="발견한 질문" hidden>
<button id="open-discovery" class="discovery-whisper" aria-describedby="discovery-field"><span class="discovery-spark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M6 6l12 12M6 18 18 6"/></svg></span><span class="discovery-copy"><span id="discovery-field"></span><span id="discovery-question"></span></span><svg class="discovery-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
<button id="dismiss-discovery" class="dismiss-whisper" aria-label="질문 알림 닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
</article>
<div id="region-arrival" class="region-arrival" aria-live="polite"><span id="region-subject"></span><strong id="region-name"></strong></div>
<dialog id="studio" class="studio" aria-label="공간 설정"><div class="studio-head"><span>내 공간</span><button id="close-studio" class="icon-button" aria-label="설정 닫기"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div>
<div class="studio-tabs" role="tablist" aria-label="설정 종류"><button id="tab-map" role="tab" aria-controls="pane-map" aria-selected="true" data-studio="map">지도</button><button id="tab-light" role="tab" aria-controls="pane-light" aria-selected="false" tabindex="-1" data-studio="light">조명</button><button id="tab-fluff" role="tab" aria-controls="pane-fluff" aria-selected="false" tabindex="-1" data-studio="fluff">플러프</button><button id="tab-audio" role="tab" aria-controls="pane-audio" aria-selected="false" tabindex="-1" data-studio="audio">소리</button></div>
<section id="pane-map" role="tabpanel" aria-labelledby="tab-map"><div class="island-map" id="island-map"></div><p class="studio-footnote">다리로 걸어가거나, 섬을 눌러 바로 이동하세요.</p></section>
<section id="pane-light" role="tabpanel" aria-labelledby="tab-light" hidden><div class="light-orb" aria-hidden="true"></div><h2>빛의 온도</h2><p class="studio-description">지금 공간에 어울리는 색으로.</p><div class="swatches" aria-label="조명 색"><button data-light="#b9b7ff" style="--swatch:#b9b7ff" aria-label="라벤더 조명"></button><button data-light="#ffb5c9" style="--swatch:#ffb5c9" aria-label="분홍빛 조명"></button><button data-light="#9cdecf" style="--swatch:#9cdecf" aria-label="민트빛 조명"></button><button data-light="#ffd5a1" style="--swatch:#ffd5a1" aria-label="살구빛 조명"></button><button data-light="#a4cdff" style="--swatch:#a4cdff" aria-label="푸른빛 조명"></button><label class="custom-color" aria-label="조명 색 직접 고르기"><input id="light-color" type="color" value="#b9b7ff" aria-label="조명 색 직접 고르기"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></label></div><label class="slider-label" for="light-level">밝기 <output id="light-value">100%</output></label><input id="light-level" type="range" min="55" max="150" value="100"></section>
<section id="pane-fluff" role="tabpanel" aria-labelledby="tab-fluff" hidden><canvas id="fluff-preview" aria-label="플러프 꾸미기 3D 미리보기"></canvas><div class="swatches" aria-label="플러프 털 색"><button data-fur="#eee3ed" style="--swatch:#eee3ed" aria-label="우유색 털"></button><button data-fur="#c7b4e7" style="--swatch:#c7b4e7" aria-label="라벤더 털"></button><button data-fur="#eeb7cb" style="--swatch:#eeb7cb" aria-label="분홍색 털"></button><button data-fur="#acdacb" style="--swatch:#acdacb" aria-label="민트색 털"></button><button data-fur="#dfc79f" style="--swatch:#dfc79f" aria-label="크림색 털"></button><button data-fur="#93a9ce" style="--swatch:#93a9ce" aria-label="푸른색 털"></button></div><label class="slider-label" for="fur-length">보송함</label><input id="fur-length" type="range" min="50" max="150" value="100"><label class="slider-label" for="roundness">동글함</label><input id="roundness" type="range" min="0" max="100" value="50"><div class="accessories" aria-label="플러프 장식"><button data-accessory="none">그대로</button><button data-accessory="star">별핀</button><button data-accessory="ribbon">리본</button></div></section>
<section id="pane-audio" role="tabpanel" aria-labelledby="tab-audio" hidden><h2>작은 소리들</h2><p class="studio-description">걸음, 물결, 발견의 순간.</p><div class="setting-row"><span>효과음</span><button id="sound" role="switch" aria-checked="true" aria-label="효과음">켜짐</button></div><label class="slider-label" for="sound-volume">볼륨 <output id="volume-value">40%</output></label><input id="sound-volume" type="range" min="0" max="100" value="40"><div class="setting-row motion-row"><span>움직임 줄이기</span><button id="motion" aria-pressed="false">끔</button></div></section>
<p class="studio-saved" role="status">이 기기에 자동으로 저장돼요.</p></dialog>
<div class="quiz-shade" id="quiz-shade" hidden></div>
<div id="quiz-overlay" class="quiz-overlay" role="dialog" aria-modal="true" aria-label="잡지식 카드" hidden>
<div class="panel-toolbar"><span>일단 알아두자.</span><button class="close-quiz icon-button" id="close-quiz" aria-label="퀴즈 닫고 공원 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div>
<main id="app"></main>
</div>
<div class="discovery-flash" aria-hidden="true"></div>
<div id="joystick" class="joystick" role="group" aria-label="플러프 이동 조이스틱"><span class="joystick-stick" aria-hidden="true"></span><button class="joy-up" data-move="up" aria-label="앞으로 이동">↑</button><button class="joy-left" data-move="left" aria-label="왼쪽으로 이동">←</button><button class="joy-right" data-move="right" aria-label="오른쪽으로 이동">→</button><button class="joy-down" data-move="down" aria-label="뒤로 이동">↓</button></div>
<div class="park-bottom">
<p id="park-status" class="sr-only" role="status">공원에 불 켜는 중…</p>
<details class="control-help"><summary><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 9h.01M12 9h.01M17 9h.01M7 12h.01M12 12h.01M17 12h.01M8 15h8"/></svg><span>조작법</span></summary><div><p><kbd>W A S D</kbd><span>이동 · 방향키도 가능</span></p><p><kbd>Space</kbd><span>점프</span></p><p><span>바닥 클릭 · 터치로 이동<br>책 가까이 가면 질문이 나타납니다.</span></p><p><span>드래그로 시점 · 휠로 확대<br>모바일에서는 플러프를 눌러 점프</span></p></div></details>

</div>
<script src="data.js?v=islands1"></script><script src="app.js?v=islands1"></script><script type="module" src="studio.js?v=islands1"></script><script src="effects.js?v=islands1"></script><script type="module" src="park.js?v=islands1"></script>
</body></html>
