<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>겨울 VFX 검증</title><style>*{box-sizing:border-box}body{margin:0;background:#091523;color:#dfeaf0;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}aside{position:fixed;left:18px;top:18px;max-width:330px;padding:16px;border:1px solid #d9ecff26;border-radius:18px;background:#172438bb;backdrop-filter:blur(12px)}h1{font-size:18px;margin:0 0 12px}button{color:inherit;background:#cce4fc14;border:1px solid #cce4fc33;border-radius:8px;padding:7px 10px;margin:3px;cursor:pointer}output{display:block;margin-top:10px;white-space:pre-wrap;font-size:12px;color:#a9c1cd}#errors{color:#ffd0c0}small{color:#93a6b3}</style><aside><h1>겨울 VFX 검증</h1><small>독립 렌더링 · 실제 게임 화면과 별도</small><div><button data-quality="high">높음</button><button data-quality="medium">보통</button><button data-quality="low">낮음</button></div><div><button data-kind="heart">하트</button><button data-kind="joy">기쁨</button><button data-kind="sad">슬픔</button><button data-kind="surprise">놀람</button><button data-kind="dance">춤</button><button id="jump">점프</button><button id="wish">소원 장식</button><button id="pause">일시정지</button><button id="motion">움직임 줄이기</button></div><output id="stats"></output><output id="errors">Shader 오류 없음</output></aside><script type="module">
import * as T from '../../dist/vendor/three.module.js';import {createFantasyVFX} from '../../dist/fantasy-vfx.js';
const scene=new T.Scene();scene.background=new T.Color('#091523');scene.fog=new T.Fog('#091523',18,42);const camera=new T.PerspectiveCamera(43,innerWidth/innerHeight,.1,80);camera.position.set(5.5,4.4,8.5);camera.lookAt(0,.8,0);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);renderer.debug.onShaderError=(gl,program,vs,fs)=>{document.querySelector('#errors').textContent=[gl.getProgramInfoLog(program),gl.getShaderInfoLog(vs),gl.getShaderInfoLog(fs)].join('\n');};window.addEventListener('error',e=>document.querySelector('#errors').textContent=e.message);
scene.add(new T.HemisphereLight('#c6dbe9','#24344a',2.2));const lamp=new T.PointLight('#edce98',80,15);lamp.position.set(-3,4,-1);scene.add(lamp);const floor=new T.Mesh(new T.PlaneGeometry(80,80),new T.MeshStandardMaterial({color:'#344b62',roughness:.8}));floor.rotation.x=-Math.PI/2;scene.add(floor);
function makeBody(){const group=new T.Group(),mat=new T.MeshStandardMaterial({color:'#ebe8df',roughness:.96}),body=new T.Mesh(new T.SphereGeometry(.74,32,24),mat);body.scale.z=.91;group.add(body);for(const side of [-1,1]){const eye=new T.Mesh(new T.SphereGeometry(1,16,12),new T.MeshPhysicalMaterial({color:'#172333',roughness:.3}));eye.position.set(side*.205,.075,.663);eye.scale.set(.068,.094,.046);group.add(eye);const foot=new T.Mesh(new T.SphereGeometry(1,16,12),mat);foot.position.set(side*.27,-.74,.14);foot.scale.set(.18,.12,.25);group.add(foot);}scene.add(group);return group;}
const body=makeBody(),other=makeBody();other.position.set(3,.86,-1);other.scale.setScalar(.8);const vfx=createFantasyVFX(scene),player={id:'self',x:0,y:.86,z:0,yaw:0,speed:2,mode:'walk',accessory:'crown,star,ribbon',jump:0,emote:''},peer={id:'guest',x:3,y:.86,z:-1,speed:0,yaw:0,accessory:'crown'};let time=0,last=performance.now(),paused=false,still=false,jumpStart=-99,emoteEnd=0,wishes=0;
const shape=new T.Shape();for(let i=0;i<10;i++){const a=Math.PI/2+i*Math.PI/5,r=i%2?.12:.27;i?shape.lineTo(Math.cos(a)*r,Math.sin(a)*r):shape.moveTo(Math.cos(a)*r,Math.sin(a)*r);}shape.closePath();const ornament=new T.ExtrudeGeometry(shape,{depth:.06,bevelEnabled:true,bevelSize:.015,bevelThickness:.01,bevelSegments:2}),target=new T.Mesh(ornament,new T.MeshStandardMaterial({color:'#e9d3a0',emissive:'#e9d3a0',emissiveIntensity:.2}));target.position.set(-2,3.2,-1.2);scene.add(target);
for(const button of document.querySelectorAll('[data-quality]'))button.onclick=()=>vfx.setQuality(button.dataset.quality);for(const button of document.querySelectorAll('[data-kind]'))button.onclick=()=>{player.emote={kind:button.dataset.kind,id:time};emoteEnd=time+2;};document.querySelector('#jump').onclick=()=>jumpStart=time;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'계속':'일시정지';};document.querySelector('#motion').onclick=()=>{still=!still;document.querySelector('#motion').textContent=still?'움직임 켜기':'움직임 줄이기';};document.querySelector('#wish').onclick=()=>{target.visible=false;vfx.animateWish({id:'preview-'+wishes++,from:{x:player.x,y:player.y+.2,z:player.z+.5},to:target.position,kind:'star',color:'#e9d3a0',geometry:ornament,onComplete:()=>{target.visible=true;}});};
function frame(ms){const dt=Math.min(.04,(ms-last)/1000);last=ms;if(!paused){time+=dt;player.x=Math.sin(time*.7)*1.3;player.z=Math.cos(time*.7)*1.3;player.yaw=Math.atan2(Math.cos(time*.7),-Math.sin(time*.7));player.jump=Math.max(0,Math.sin(Math.min(1,(time-jumpStart)/.9)*Math.PI))*.85;player.y=.86+player.jump;if(time>emoteEnd)player.emote='';body.position.set(player.x,player.y,player.z);body.rotation.y=player.yaw;vfx.update({time,dt,still,player,peers:[peer],camera});}renderer.render(scene,camera);document.querySelector('#stats').textContent=`${vfx.stats.quality} · 입자 ${vfx.stats.activeParticles} / ${vfx.stats.particleCapacity}\n트레일 ${vfx.stats.trailVertices} vertices · 소원 ${vfx.stats.activeFlights}\n${renderer.info.render.calls} draw calls · ${Math.round(time*10)/10}s`;requestAnimationFrame(frame);}requestAnimationFrame(frame);window.vfxProbe={vfx,renderer,scene,camera,player};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></html>
